<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RailAI Pro: Intelligent Transit Optimizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen">

  <header class="bg-slate-900 text-white border-b-2 border-orange-500 py-3 px-6 sticky top-0 z-40 shadow">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-orange-500 p-2 rounded-lg text-white">
          <i data-lucide="git-branch" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight">RailAI Enterprise Optimizer</h1>
          <p class="text-[11px] text-slate-400">RAPTOR Multi-Hop & Dynamic Risk Prediction Engine</p>
        </div>
      </div>
      <div class="text-xs flex items-center gap-3">
        <span class="bg-slate-800 text-emerald-400 px-3 py-1 rounded-full border border-slate-700 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Backend Sync
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-5 space-y-4">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-3.5">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">From</label>
            <input type="text" id="fromInput" value="Aurangabad (AWB)" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-lg outline-none font-semibold">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">To</label>
            <input type="text" id="toInput" value="Guwahati (GHY)" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-lg outline-none font-semibold">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Max Changes</label>
            <select id="maxChanges" class="w-full px-2.5 py-2 text-xs bg-slate-50 border border-slate-300 rounded-lg outline-none">
              <option value="1">1 Change</option>
              <option value="2" selected>2 Changes</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Engine</label>
            <input type="text" readonly value="Render API Live" class="w-full px-2.5 py-2 text-xs bg-slate-100 text-slate-500 border border-slate-300 rounded-lg outline-none">
          </div>
        </div>

        <button onclick="runSearch()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-lg text-xs shadow transition flex items-center justify-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4"></i> Optimize Connecting Route
        </button>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3">
        <div id="routeMap" class="w-full h-64 rounded-lg z-10 border border-slate-200"></div>
      </div>
    </div>

    <div class="lg:col-span-7 space-y-4">
      <div id="printableDossier" class="space-y-4"></div>
    </div>
  </main>

  <script>
    const API_BASE_URL = "https://railai-project.onrender.com/api/v1";

    const STATIONS_GEO = {
      'AWB': { name: 'Aurangabad', lat: 19.8762, lon: 75.3433 },
      'NGP': { name: 'Nagpur Jn', lat: 21.1528, lon: 79.0882 },
      'GHY': { name: 'Guwahati', lat: 26.1824, lon: 91.7506 },
      'NDLS': { name: 'New Delhi', lat: 28.6427, lon: 77.2198 },
      'ET':  { name: 'Itarsi Jn', lat: 22.6120, lon: 77.7610 },
      'MMCT': { name: 'Mumbai Central', lat: 18.9696, lon: 72.8193 }
    };

    let mapInstance = null;

    function initMap() {
      mapInstance = L.map('routeMap').setView([22.5, 82.0], 4);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(mapInstance);
    }

    function extractStationCode(text) {
      const match = text.match(/\(([A-Z]+)\)/);
      return match ? match[1] : text.trim().toUpperCase();
    }

    async function runSearch() {
      const dossier = document.getElementById('printableDossier');
      const fromCode = extractStationCode(document.getElementById('fromInput').value);
      const toCode = extractStationCode(document.getElementById('toInput').value);
      const maxChanges = document.getElementById('maxChanges').value || 2;

      dossier.innerHTML = `
        <div class="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-600">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-orange-500 border-t-transparent mb-3"></div>
          <p class="text-xs font-semibold">Contacting Render API (${fromCode} to ${toCode})...</p>
          <p class="text-[11px] text-slate-400 mt-1">If Render was idle, please allow 30-40 seconds for it to wake up.</p>
        </div>
      `;

      try {
        const url = `${API_BASE_URL}/routes?origin=${fromCode}&destination=${toCode}&max_changes=${maxChanges}`;
        console.log("Triggering fetch to:", url);
        
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        const data = await response.json();
        renderResults(data, fromCode, toCode);
      } catch (err) {
        console.error("Fetch failed:", err);
        dossier.innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-xs text-red-700">
            <strong>Connection Failed:</strong> ${err.message}.<br>
            <span class="text-[11px] text-red-500">Check if CORS is enabled on the backend or verify if the service is awake.</span>
          </div>
        `;
      }
    }

    function renderResults(data, origin, dest) {
      const dossier = document.getElementById('printableDossier');
      let legsHtml = '';
      let mapCoords = [];

      if (data.legs && data.legs.length > 0) {
        data.legs.forEach((leg, i) => {
          legsHtml += `
            <div class="border border-slate-200 rounded-lg p-3 bg-slate-50 mb-2">
              <div class="flex justify-between text-xs font-bold text-slate-800">
                <span>Leg ${i + 1}: Train ${leg.train_number} - ${leg.train_name}</span>
                <span class="text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded text-[10px]">Punctuality ${leg.punctuality_score}%</span>
              </div>
              <div class="grid grid-cols-2 text-xs text-slate-600 mt-2">
                <div>Dep: <strong>${leg.departure_time}</strong> (${leg.from_station})</div>
                <div class="text-right">Arr: <strong>${leg.arrival_time}</strong> (${leg.to_station})</div>
              </div>
            </div>
          `;
          if (STATIONS_GEO[leg.from_station]) mapCoords.push([STATIONS_GEO[leg.from_station].lat, STATIONS_GEO[leg.from_station].lon]);
          if (STATIONS_GEO[leg.to_station]) mapCoords.push([STATIONS_GEO[leg.to_station].lat, STATIONS_GEO[leg.to_station].lon]);
        });
      } else {
        legsHtml = `<p class="text-xs text-slate-500">No route legs returned from engine.</p>`;
      }

      dossier.innerHTML = `
        <div class="bg-white rounded-xl border border-orange-400 p-5 shadow-sm space-y-4">
          <div class="flex justify-between items-center border-b border-slate-100 pb-3">
            <h3 class="text-sm font-bold text-slate-900">${origin} → ${dest}</h3>
            <span class="text-xs font-bold text-slate-700">Reliability: ${data.reliability_score || 94}%</span>
          </div>
          <div>${legsHtml}</div>
        </div>
      `;

      if (mapInstance && mapCoords.length > 1) {
        L.polyline(mapCoords, { color: '#F97316', weight: 4 }).addTo(mapInstance);
        mapInstance.fitBounds(mapCoords, { padding: [30, 30] });
      }
      lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initMap();
      lucide.createIcons();
      runSearch();
    });
  </script>
</body>
</html>
